plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.edgeview'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.edgeview'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        vectorDrawables.useSupportLibrary = true

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Allow passing OPENCV_SDK via gradle.properties or environment
def opencvsdk = project.findProperty('OPENCV_SDK') ?: System.getenv('OPENCV_SDK')

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

android {
    if (opencvsdk) {
        externalNativeBuild.cmake.arguments += ["-DOPENCV_SDK=${opencvsdk}"]
    }
}
